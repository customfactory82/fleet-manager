<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet Manager</title>
<meta name="description" content="Fleet Manager by Custom Factory: vehicles, drivers, trips, fuel and maintenance. Records are saved on this phone.">
<meta name="theme-color" content="#2B3036">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fleet Manager">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Barlow";src:url(fonts/barlow-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Barlow";src:url(fonts/barlow-600.woff2) format("woff2");font-weight:500 600;font-display:swap}
@font-face{font-family:"Barlow";src:url(fonts/barlow-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Barlow";src:url(fonts/barlow-800.woff2) format("woff2");font-weight:800 900;font-display:swap}
@font-face{font-family:"Barlow Condensed";src:url(fonts/barlow-condensed-700.woff2) format("woff2");font-weight:600 700;font-display:swap}
@font-face{font-family:"Barlow Condensed";src:url(fonts/barlow-condensed-800.woff2) format("woff2");font-weight:800 900;font-display:swap}
:root{
  /* Custom Factory brand from the printed logbook: steel grey + hi-vis yellow */
  --steel:#2B3036; --steel-2:#3E464F; --mid:#5D6670; --line:#D3D8DD; --paper:#F2F3F5; --card:#FFFFFF; --tint:#E8EBEE;
  --yel:#FFD400; --yel-soft:#FFF6C2;
  --over:#C62828; --over-soft:#FDECEC; --soon:#8A5200; --soon-soft:#FFF0D1; --ok:#2E7D32; --ok-soft:#E6F3E7;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* layout: hazard-stripe header, one app column (max 760px), one card per record, bottom tab bar for one-handed use */
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--steel);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #1A73E8;outline-offset:2px}
.app{max-width:760px;margin:0 auto;padding-bottom:96px}
.stripe{height:8px;background:repeating-linear-gradient(-45deg,var(--yel) 0 10px,var(--steel) 10px 20px)}
header.top{background:var(--steel);color:#fff;padding:12px 16px 16px}
.topline{display:flex;align-items:center;gap:10px;min-height:30px}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:1.5px solid #6E7782;color:#fff;border-radius:6px;min-height:32px;padding:0 10px 0 6px;font-weight:700;font-size:14px;cursor:pointer}
.back svg{width:18px;height:18px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);background:var(--yel);padding:2px 7px;white-space:nowrap}
.co{margin-left:auto;font-size:14px;font-weight:600;color:#C9CFD5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
h1{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.05;margin:10px 0 4px;text-wrap:balance}
.sub{color:#C9CFD5;font-size:15px;text-wrap:pretty}
main{padding:16px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
h2{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin:0;display:flex;align-items:center;gap:8px}
h2::before{content:"";flex:none;width:10px;height:10px;background:var(--yel);border:2px solid var(--steel)}
h3{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin:0;color:var(--mid)}
.card>h2,.lsec>h2{margin-bottom:10px}
p{margin:0}
.muted{color:var(--mid)}
.na{color:#9AA2AA}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:8px;border:2px solid var(--steel);background:#fff;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--yel)}
.btn.dark{background:var(--steel);color:#fff}
.btn.danger{border-color:var(--over);color:var(--over);background:#fff}
.btn.danger.armed{background:var(--over);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:default}
.qa{display:flex;flex-wrap:wrap;gap:8px}
.banner{background:var(--yel-soft);border-left:6px solid var(--yel);padding:10px 12px;border-radius:6px;font-size:15px}
.banner.warn{background:var(--soon-soft);border-left-color:var(--soon)}
.tip{background:var(--yel-soft);border-left:6px solid var(--yel);padding:10px 12px;border-radius:6px;font-size:15px}
.tip b{font-weight:800;letter-spacing:.08em;margin-right:6px}
/* cover panel */
.cover{background:#fff;border-radius:10px;border:1px solid var(--line);border-top:6px solid var(--yel);padding:14px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.lbl{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mid)}
.cv-name{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;margin:2px 0 4px;overflow-wrap:anywhere}
.cv-meta{font-size:14px;color:var(--mid)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:#fff;border:1px solid var(--line);border-bottom:4px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;cursor:pointer;text-align:left}
.tile b{font-family:var(--display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;font-weight:600;color:var(--mid);line-height:1.2}
.tile.info{border-bottom-color:var(--steel)}
.tile.soon{border-bottom-color:var(--soon)}
.tile.soon b{color:var(--soon)}
/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.row{background:#fff;border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:2px;cursor:pointer;text-align:left}
.row:hover{border-color:#B8BFC6}
.row.sel{outline:2.5px solid var(--steel);outline-offset:1px}
.row.over{border-left-color:var(--over)} .row.soon{border-left-color:var(--soon)} .row.ok{border-left-color:var(--ok)} .row.info{border-left-color:var(--steel)}
.r-top{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mid);font-variant-numeric:tabular-nums}
.r-main{grid-column:1;font-weight:700;overflow-wrap:anywhere}
.r-meta,.r-extra,.r-foot{grid-column:1;font-size:14px;color:var(--mid);overflow-wrap:anywhere}
.r-amt{grid-column:2;grid-row:2/span 3;align-self:center;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.r-act{grid-column:1/-1;margin-top:6px}
.reg{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.3;background:var(--yel);color:var(--steel);padding:0 6px;border:1.5px solid var(--steel);border-radius:3px;letter-spacing:.05em;white-space:nowrap}
.no{font-weight:800;color:var(--steel)}
.pill{font-size:12px;font-weight:800;padding:1px 8px;border-radius:99px;white-space:nowrap;letter-spacing:.02em}
.pill.over{background:var(--over-soft);color:var(--over)}
.pill.soon{background:var(--soon-soft);color:var(--soon)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.info{background:var(--steel);color:var(--yel)}
.pill.mute{background:var(--tint);color:var(--mid)}
.empty{background:#fff;border:1.5px dashed #B8BFC6;border-radius:8px;padding:16px;color:var(--mid);text-align:center}
.sumbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-variant-numeric:tabular-nums}
.lsec{display:flex;flex-direction:column}
.fbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fbar label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--mid)}
.fbar select{width:auto;min-width:180px;flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;min-height:38px;padding:0 14px;border-radius:99px;border:1.5px solid #AEB5BD;background:#fff;font-weight:700;font-size:14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--steel);border-color:var(--steel);color:#fff}
/* sections grid */
.inside{display:flex;flex-direction:column;gap:14px}
.grp-h{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);margin-bottom:6px}
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.sec{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left}
.sn{font-family:var(--display);font-weight:800;font-size:20px;color:var(--mid);width:28px;font-variant-numeric:tabular-nums}
.st b{display:block;font-weight:700}
.st small{display:block;color:var(--mid);font-size:13px}
.sc{font-size:12px;font-weight:800;background:var(--tint);border-radius:99px;padding:1px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sc.soon{background:var(--soon-soft);color:var(--soon)}
.sc:empty{display:none}
/* definition grids */
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 14px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mid)}
.dl dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere;white-space:pre-wrap}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.ch h2{margin:0}
.ren-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ren-h .mm{color:var(--mid);font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:0}
.ri{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:6px;padding:6px 10px}
.ri.over{border-left-color:var(--over);background:var(--over-soft)}
.ri.soon{border-left-color:var(--soon);background:var(--soon-soft)}
.ri.ok{border-left-color:var(--ok)}
.ri dt{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mid)}
.ri dd{margin:2px 0 0;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* vehicle summary */
.vsum{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.vsum .big{font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.tabs2{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;position:sticky;top:0;background:var(--paper);z-index:5}
.tabs2 button{flex:none;min-height:40px;padding:0 14px;border:0;border-bottom:3px solid transparent;background:none;font-weight:700;color:var(--mid);cursor:pointer}
.tabs2 button[aria-selected="true"]{color:var(--steel);border-bottom-color:var(--yel)}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table.grid{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
table.grid th{background:var(--steel);color:#fff;font-size:12px;font-weight:700;text-align:right;padding:8px;white-space:nowrap;vertical-align:bottom}
table.grid td{border-top:1px solid var(--line);padding:7px 8px;white-space:nowrap;text-align:right;background:#fff}
table.grid th:first-child,table.grid td:first-child{text-align:left;position:sticky;left:0;z-index:1}
table.grid th:first-child{background:var(--steel)}
table.grid tr.tot td{background:var(--yel-soft);border-top:2px solid var(--steel);font-weight:800}
table.grid tr.grp td{background:var(--yel);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;text-align:left}
table.grid td.it{white-space:normal;min-width:170px;font-size:14px}
table.grid td.c{text-align:center;font-weight:800;font-size:16px}
td.ok{color:var(--ok)} td.fix{color:var(--over);background:var(--over-soft)!important}
table.grid th .thb{background:none;border:0;color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0}
table.grid input{width:84px;min-height:38px;text-align:right;padding:6px 8px}
/* steps */
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
ol.steps li{counter-increment:s;position:relative;padding-left:40px;line-height:1.45}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;background:var(--steel);color:var(--yel);font-weight:800;display:flex;align-items:center;justify-content:center;border-radius:4px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
/* glovebox card */
.ecard{background:#fff;border:2px dashed var(--mid);border-radius:10px;padding:14px;max-width:420px}
.et{background:var(--steel);color:var(--yel);font-weight:800;font-size:14px;letter-spacing:.1em;padding:8px 10px;margin-bottom:10px}
.kv{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding:6px 0}
.kv span{width:130px;flex:none;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mid)}
.kv b{overflow-wrap:anywhere}
.ecard ol{margin:10px 0 0;padding-left:20px;font-weight:600;line-height:1.5}
/* footer */
.foot{font-size:13px;color:var(--mid);border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:2px}
.foot b{color:var(--steel)}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--steel);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);max-width:760px;margin:0 auto}
nav.tabs button{background:none;border:0;border-top:3px solid transparent;color:#C9CFD5;padding:7px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;cursor:pointer}
nav.tabs button[aria-current="page"]{color:#fff;border-top-color:var(--yel)}
nav.tabs svg{width:24px;height:24px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:none;background:rgba(20,23,26,.6)}
.sheet.open{display:flex;justify-content:center;align-items:stretch}
.sh{background:var(--paper);width:100%;max-width:720px;height:100%;display:flex;flex-direction:column}
@media (min-width:760px){.sheet.open{align-items:center}.sh{height:auto;max-height:94%;border-radius:12px;overflow:hidden}}
.sh-head{background:var(--steel);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;flex:none}
.sh-head h2{color:#fff;font-size:15px;flex:1}
.sh-x{background:none;border:1.5px solid #6E7782;color:#fff;border-radius:6px;min-height:36px;min-width:36px;cursor:pointer;font-size:20px;line-height:1}
.sh-body{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
.sh-foot{flex:none;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:6px}
.sh-btns{display:flex;gap:10px;align-items:center}
.sh-btns .sp{flex:1}
.sh-msg{font-size:14px;font-weight:600;color:var(--over)}
.sh-msg:empty{display:none}
.sh-msg.okm{color:var(--ok)}
/* forms */
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label,.fld .lab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mid)}
.rq{color:var(--over);font-style:normal}
.hint{font-size:13px;color:var(--mid)}
input,select,textarea{width:100%;min-height:44px;border:1.5px solid #AEB5BD;border-radius:8px;padding:8px 10px;background:#fff;font-size:16px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--steel);outline:none;box-shadow:0 0 0 3px var(--yel)}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--over)}
.chkf{justify-content:flex-end}
.chk{display:flex!important;align-items:center;gap:10px;min-height:44px;font-size:16px!important;text-transform:none!important;letter-spacing:0!important;color:var(--steel)!important;font-weight:600!important;cursor:pointer}
.chk input{width:24px;height:24px;min-height:0;accent-color:var(--steel)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:42px;min-width:46px;padding:0 12px;border:1.5px solid #AEB5BD;border-radius:8px;background:#fff;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--steel);color:#fff;border-color:var(--steel)}
.ckseg button[data-sv="ok"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.ckseg button[data-sv="fix"][aria-pressed="true"]{background:var(--over);border-color:var(--over)}
.ckg{display:flex;flex-direction:column;gap:0;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ckg h3{background:var(--yel);color:var(--steel);padding:6px 12px}
.ck{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.ck>span{flex:1;min-width:150px;font-weight:600}
.hcol{background:#fff;border:1.5px solid var(--steel);border-radius:10px;padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.hct{background:var(--steel);color:var(--yel);font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0 -12px;padding:8px 12px}
.sgrp{display:flex;flex-direction:column;gap:10px}
/* damage diagram */
.dtools{display:flex;flex-direction:column;gap:8px}
.legend{font-size:14px;color:var(--steel-2)}
.legend .r{color:var(--over)}
.diag{display:grid;grid-template-columns:auto 1fr;gap:12px 16px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--steel-2);align-items:center}
.dv{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.dv.side{grid-column:1/-1}
.dv em{font-style:normal;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mid)}
.dz{position:relative;width:100%;cursor:crosshair;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.dz>div{height:100%}
.dz svg{display:block;width:100%;height:auto}
.dv.side .dz{max-width:420px}
.dv.top .dz{height:250px;width:auto;aspect-ratio:140/300}
.dv.top svg{height:100%;width:100%}
.fr2{display:flex;flex-direction:column;gap:10px;align-items:center}
.fr2 .dz{max-width:200px}
.flip{transform:scaleX(-1)}
.mk{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:var(--steel);color:#fff;font:800 13px/22px var(--body);text-align:center;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--steel);padding:0;cursor:pointer}
.mk.in{background:var(--over);box-shadow:0 0 0 1.5px var(--over)}
.sigs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.sigbox{display:flex;flex-direction:column;gap:4px}
.sigbox .sl{display:flex;justify-content:space-between;align-items:center}
.sigbox .sl span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mid)}
.sigbox .sl button{background:none;border:0;color:var(--steel);font-weight:700;text-decoration:underline;cursor:pointer;font-size:14px;min-height:32px}
.sigbox canvas{width:100%;aspect-ratio:10/3;background:#fff;border:1.5px dashed #AEB5BD;border-radius:8px;touch-action:none;display:block;cursor:crosshair}
.decl{font-size:13px;color:var(--mid);line-height:1.45}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--steel);color:#fff;padding:10px 16px;border-radius:8px;font-weight:700;z-index:70;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none}
.toast.show{display:block}
.toast.err{background:var(--over)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.btn{position:relative}
.btn:focus-within{outline:3px solid #1A73E8;outline-offset:2px}
.phg{display:flex;flex-direction:column;gap:8px}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.phw{position:relative}
.ph{display:block;width:100%;aspect-ratio:1;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--tint);padding:0;cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.busy,.ph.broken{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--mid);text-align:center;padding:6px}
.ph.busy{cursor:progress;background:repeating-linear-gradient(-45deg,var(--tint) 0 8px,#F6F7F8 8px 16px)}
.ph.broken img{display:none}
.ph.broken::after{content:"Photo not available"}
.ph-x{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:2px solid #fff;background:var(--steel);color:#fff;font-size:18px;line-height:1;cursor:pointer;padding:0}
.phnone{font-size:14px}
.lb{position:fixed;inset:0;z-index:80;background:#0F1113;display:flex;flex-direction:column;color:#fff}
.lb-top,.lb-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;flex:none}
.lb-top span{font-weight:700;font-size:15px}
.lb img{flex:1;min-height:0;width:100%;object-fit:contain}
.lb button{background:none;border:1.5px solid #6E7782;color:#fff;border-radius:6px;min-height:42px;min-width:42px;padding:0 14px;font-weight:700;cursor:pointer}
.lb button[disabled]{opacity:.35;cursor:default}
.bkc.stale{border-left:6px solid var(--soon)}
.inst{border-top:6px solid var(--yel)}
.inst p{margin-bottom:10px}
.drv{display:flex;flex-direction:column;gap:8px;padding-top:12px;margin-top:12px;border-top:1px solid var(--line)}
.ch+.drv{border-top:0;margin-top:0;padding-top:0}
.drv-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.drv-h .sp{flex:1}
a.btn{color:var(--steel)} a.btn.dark{color:#fff}
@media (max-width:420px){h1{font-size:28px}.tile b{font-size:28px}.cv-name{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<body>
<div class="app">
  <div class="stripe" aria-hidden="true"></div>
  <header class="top">
    <div class="topline">
      <button class="back" id="hBack" type="button" data-act="back" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Back</button>
      <span class="kicker">Fleet Manager</span>
      <span class="co" id="hCo"></span>
    </div>
    <h1 id="hTitle">Fleet overview</h1>
    <div class="sub" id="hSub"></div>
  </header>

</div>

<nav class="tabs" aria-label="Main">
  <div class="in">

    <button type="button" data-act="tab" data-v="fleet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 16v-3l2-5h14l2 5v3z"/><circle cx="7.5" cy="16.5" r="2"/><circle cx="16.5" cy="16.5" r="2"/><path d="M3 13h18"/></svg>Fleet</button>
    <button type="button" data-act="tab" data-v="drivers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Drivers</button>
    <button type="button" data-act="tab" data-v="schedule"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h3"/></svg>Trips</button>
  </div>
</nav>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sh" role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <div class="sh-head"><h2 id="shTitle">Entry</h2><button class="sh-x" type="button" data-act="close-sheet" aria-label="Close">×</button></div>
    <div class="sh-body" id="shBody"></div>
    <div class="sh-foot">
      <div class="sh-msg" id="shMsg" role="status"></div>
      <div class="sh-btns"><button class="btn danger" type="button" id="shDel" data-act="sheet-del">Delete</button><span class="sp"></span><button class="btn" type="button" data-act="close-sheet">Cancel</button><button class="btn pri" type="button" id="shSave" data-act="sheet-save">Save</button></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-labelledby="lbCap">
  <div class="lb-top"><span id="lbCap">Photo</span><button type="button" data-act="lb-close" aria-label="Close photo">×</button></div>
  <img id="lbImg" alt="">
  <div class="lb-nav"><button type="button" id="lbPrev" data-act="lb-prev">Previous</button><span id="lbN"></span><button type="button" id="lbNext" data-act="lb-next">Next</button></div>
</div>

<script>
(() => {
'use strict';
/* ---------------- helpers ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const pad2 = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const nowLocal = () => { const d = new Date(); return `${todayISO()}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const splitISO = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || '')); return m ? [+m[1], +m[2], +m[3]] : null; };
const fmtDate = iso => { const p = splitISO(iso); return p ? `${p[2]} ${MON[p[1]-1]} ${p[0]}` : ''; };
const fmtShort = iso => { const p = splitISO(iso); return p ? `${p[2]} ${MON[p[1]-1]}` : '—'; };
const fmtDT = s => { if (!s) return ''; const t = /T(\d{2}:\d{2})/.exec(s); return fmtDate(s) + (t ? ', ' + t[1] : ''); };
const num = v => (v === null || v === undefined || v === '' || isNaN(Number(v))) ? null : Number(v);
const nf = new Intl.NumberFormat('en-GB', {maximumFractionDigits: 2});
const n0 = v => num(v) == null ? '' : nf.format(num(v));
const money = v => num(v) == null ? '' : 'SCR ' + nf.format(num(v));
const fmtKm = v => num(v) == null ? '' : nf.format(num(v)) + ' km';
const DAY = 86400000;
const parseISO = iso => { const p = splitISO(iso); return p ? new Date(p[0], p[1]-1, p[2]) : null; };
const daysUntil = iso => { const d = parseISO(iso); return d ? Math.round((d - parseISO(todayISO())) / DAY) : null; };
const plural = (n, w, pl) => `${nf.format(n)} ${n === 1 ? w : (pl || w + 's')}`;
const join = a => a.filter(x => x !== null && x !== undefined && x !== '' && x !== false).join(' · ');
const getPath = (o, k) => k.split('.').reduce((a, p) => (a == null ? undefined : a[p]), o);
const setPath = (o, k, v) => { const ps = k.split('.'); let a = o; ps.slice(0, -1).forEach(p => { if (typeof a[p] !== 'object' || a[p] === null) a[p] = {}; a = a[p]; }); a[ps[ps.length-1]] = v; };
const clone = o => JSON.parse(JSON.stringify(o || {}));
const pill = st => st ? `<span class="pill ${st[0]}">${esc(st[1])}</span>` : '';
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------------- car drawings (same as the printed logbook) ---------------- */
const G = '<g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round">';
const SVG = {
  side: `<svg viewBox="0 0 320 120" aria-hidden="true">${G}<path d="M18,92 L14,78 Q14,66 28,62 L92,54 L128,26 Q134,22 144,22 L222,22 Q232,22 238,28 L268,54 L296,58 Q306,60 306,72 L306,90 L267,92 A22,22 0 0 0 223,92 L97,92 A22,22 0 0 0 53,92 Z"/><path d="M104,52 L132,30 Q136,27 142,27 L176,27 L176,52 Z"/><path d="M182,52 L182,27 L220,27 Q228,27 233,32 L258,52 Z"/><path d="M179,56 L179,90"/><path d="M150,62 L162,62"/><path d="M205,62 L217,62"/><path d="M18,70 L34,68"/><path d="M296,66 L304,66"/><circle cx="75" cy="92" r="16"/><circle cx="75" cy="92" r="6"/><circle cx="245" cy="92" r="16"/><circle cx="245" cy="92" r="6"/></g></svg>`,
  top: `<svg viewBox="0 0 140 300" aria-hidden="true">${G}<rect x="20" y="12" width="100" height="276" rx="32"/><path d="M30,98 L110,98 L101,128 L39,128 Z"/><rect x="39" y="132" width="62" height="86" rx="6"/><path d="M39,222 L101,222 L107,246 L33,246 Z"/><path d="M45,30 Q70,22 95,30"/><path d="M45,272 Q70,280 95,272"/><ellipse cx="13" cy="114" rx="7" ry="4"/><ellipse cx="127" cy="114" rx="7" ry="4"/><rect x="9" y="48" width="10" height="34" rx="3"/><rect x="121" y="48" width="10" height="34" rx="3"/><rect x="9" y="214" width="10" height="34" rx="3"/><rect x="121" y="214" width="10" height="34" rx="3"/></g></svg>`,
  front: `<svg viewBox="0 0 160 112" aria-hidden="true">${G}<path d="M14,88 L14,62 Q14,52 24,50 L40,22 Q44,16 52,16 L108,16 Q116,16 120,22 L136,50 Q146,52 146,62 L146,88 Z"/><path d="M46,46 L57,23 L103,23 L114,46 Z"/><rect x="20" y="58" width="24" height="10" rx="3"/><rect x="116" y="58" width="24" height="10" rx="3"/><rect x="56" y="62" width="48" height="14" rx="3"/><path d="M20,80 L140,80"/><rect x="20" y="88" width="20" height="16" rx="3"/><rect x="120" y="88" width="20" height="16" rx="3"/></g></svg>`,
  rear: `<svg viewBox="0 0 160 112" aria-hidden="true">${G}<path d="M14,88 L14,62 Q14,52 24,50 L40,22 Q44,16 52,16 L108,16 Q116,16 120,22 L136,50 Q146,52 146,62 L146,88 Z"/><path d="M48,46 L58,25 L102,25 L112,46 Z"/><path d="M18,56 L36,56 L36,70 L18,70 Z"/><path d="M124,56 L142,56 L142,70 L124,70 Z"/><rect x="60" y="60" width="40" height="13" rx="2"/><path d="M20,80 L140,80"/><rect x="20" y="88" width="20" height="16" rx="3"/><rect x="120" y="88" width="20" height="16" rx="3"/></g></svg>`,
};
const VIEWN = {left:'Left side', right:'Right side', top:'Top', front:'Front', rear:'Rear'};
const CODES = [['S','scratch'],['D','dent'],['C','chip / crack'],['B','broken'],['M','missing']];

/* ---------------- logbook fields (same categories and inputs as the printed logbook) ---------------- */
const T = (k, l, t = 'text', x = {}) => Object.assign({k, l, t}, x);
const FUEL = ['Petrol','Diesel','Hybrid','EV'];
const WORKSHOPS = ['Custom Factory'];
const V_REG = [T('no','No.','num'), T('reg','Reg. no.','text',{req:1, ph:'e.g. S 12345'}), T('make','Make & model'), T('year','Year','num'), T('fuel','Fuel','select',{o:FUEL}), T('colour','Colour'), T('seats','Seats','num'), T('dateIn','Date in fleet','date',{def:todayISO}), T('dateOut','Date out / sold','date')];
const V_DETAILS = [T('make','Make & model'), T('year','Year','num'), T('vin','VIN / chassis no.'), T('engineNo','Engine no.'), T('engineSize','Engine size'), T('fuel','Fuel type','select',{o:FUEL}), T('trans','Transmission','text',{o:['Manual','Automatic','CVT']}), T('colour','Colour'), T('dateBought','Date bought','date'), T('boughtFrom','Bought from'), T('odoBought','Odometer when bought (km)','num',{u:'km'}), T('price','Purchase price (SCR)','num',{u:'scr'})];
const V_PARTS = [T('oil','Engine oil grade & quantity'), T('oilFilter','Oil filter part no.'), T('airFilter','Air filter part no.'), T('cabinFilter','Cabin filter part no.'), T('plugs','Spark plugs / glow plugs'), T('coolant','Coolant type'), T('atf','Gearbox oil / ATF'), T('brakeFluid','Brake fluid'), T('battery','Battery size'), T('wipers','Wiper blade sizes'), T('tyreSize','Tyre size front / rear'), T('tyrePressure','Tyre pressure front / rear')];
const V_INS = [T('insurer','Insurer'), T('policyNo','Policy no.'), T('cover','Cover type'), T('insExp','Insurance expiry','date'), T('svcKm','Service every (km)','num',{u:'km'}), T('svcMonths','Service every (months)','num'), T('workshop','Workshop','text',{o:WORKSHOPS}), T('workshopPhone','Workshop phone','tel'), T('warranty','Warranty until','date')];
const V_REN = [T('insExp','Insurance expiry','date'), T('licExp','Vehicle licence expiry','date'), T('testDue','Vehicle test due','date'), T('permitExp','Operating permit expiry','date'), T('nextSvcDate','Next service due (date)','date'), T('nextSvcKm','Next service due (km)','num',{u:'km'}), T('checkedDate','Checked (date)','date',{def:todayISO}), T('checkedBy','Checked (initials)')];
const V_KEYS = [T('keysCount','No. of keys','num'), T('keyCode','Key / remote code'), T('spareAt','Spare key kept at'), T('keysChecked','Last checked','date',{def:todayISO}), T('keysNotes','Notes','textarea',{w:'wide'})];
const V_NOTES = [T('notes','Notes','textarea',{w:'wide'})];
const VGROUPS = {
  reg:{name:'Register details', f:V_REG}, details:{name:'Vehicle details', f:V_DETAILS}, parts:{name:'Parts & fluids', f:V_PARTS},
  ins:{name:'Insurance & service plan', f:V_INS}, ren:{name:'Renewals', f:V_REN}, keys:{name:'Keys', f:V_KEYS}, notes:{name:'Notes', f:V_NOTES},
};
const COMPANY = [T('name','Company name','text',{w:'wide'}), T('manager','Fleet manager'), T('phone','Phone','tel'), T('started','Records started','date',{def:todayISO}), T('vehicles','Number of vehicles','num'), T('phone24','24h phone for glovebox cards','tel')];
const VSEL = T('vid','Vehicle reg. no.','vehicle',{req:1});
const DSEL = T('did','Driver','driver',{req:1});
const PURPOSES = ['Guest transfer','Airport pick-up','Airport drop-off','Excursion','Delivery','Staff transport','Service / repair','Fuel'];
const D_FIELDS = [T('name','Full name','text',{req:1, w:'wide'}), T('phone','Mobile / WhatsApp','tel',{ph:'e.g. 2 512 345'}), T('licence','Driving licence no.'), T('licClass','Licence class / categories'), T('licExp','Licence expiry','date'), T('vid','Assigned vehicle','vehicle'), T('dateStart','Date started','date',{def:todayISO}), T('dateLeft','Date left','date',{hint:'Fill in when the driver leaves. Their trips stay in the log.'}), T('emergency','Emergency contact','text',{w:'wide'}), T('notes','Notes','textarea',{w:'wide'})];


const LOGS = {
  services: { one:'service', date:'date', hasV:1,
    fields:[VSEL, T('date','Date','date',{def:todayISO}), T('odo','Odometer (km)','num'), T('work','Work done','textarea',{w:'wide'}), T('parts','Parts replaced','text',{w:'wide'}), T('workshop','Workshop','text',{o:WORKSHOPS}), T('invoice','Invoice no.'), T('cost','Cost (SCR)','num'), T('nextKm','Next due (km)','num',{hint:'Also updates the Renewals tracker.'}), T('nextDate','Next due (date)','date')],
    card: r => ({main: r.work || 'Service', meta: join([fmtKm(r.odo), r.workshop, r.invoice && 'Invoice ' + r.invoice]), extra: r.parts ? 'Parts: ' + r.parts : '', foot: (r.nextKm != null || r.nextDate) ? 'Next due ' + join([fmtKm(r.nextKm), fmtDate(r.nextDate)]).replace(' · ', ' / ') : '', amt: r.cost}),
    total: r => num(r.cost) || 0 },
  repairs: { one:'defect', date:'dateReported', hasV:1,
    fields:[VSEL, T('dateReported','Date reported','date',{def:todayISO}), T('reportedBy','Reported by'), T('defect','Defect / fault','textarea',{w:'wide', req:1}), T('action','Action taken','textarea',{w:'wide'}), T('dateFixed','Date fixed','date',{hint:'Leave empty while the fault is still open.'}), T('daysOff','Days off road','num'), T('cost','Cost (SCR)','num'), T('initials','Initials')],
    card: r => ({main: r.defect || 'Defect', meta: join([r.reportedBy && 'Reported by ' + r.reportedBy, num(r.daysOff) != null && plural(num(r.daysOff), 'day') + ' off road']), extra: r.action ? 'Action: ' + r.action : '', amt: r.cost}),
    status: r => r.dateFixed ? ['ok', 'Fixed ' + fmtDate(r.dateFixed)] : ['soon', 'Open'], total: r => num(r.cost) || 0 },
  damage: { one:'incident', date:'date', hasV:1, photos:1, tip:'Add photos and the driver’s account for each entry. They are your proof for the insurer or a third party.',
    fields:[VSEL, T('date','Date','date',{def:todayISO}), T('ref','Report no.'), T('did','Driver','driver'), T('what','What happened / damage','textarea',{w:'wide', req:1}), T('police','Police ref.'), T('claim','Insurance claim no.'), T('cost','Repair cost (SCR)','num'), T('recovered','Recovered (SCR)','num'), T('closed','Closed','check')],
    card: r => ({main: r.what || 'Incident', meta: join([r.did && dname(r.did), r.ref && 'Ref. ' + r.ref, r.police && 'Police ' + r.police, r.claim && 'Claim ' + r.claim]), foot: num(r.recovered) != null ? 'Recovered ' + money(r.recovered) : '', amt: r.cost}),
    status: r => r.closed ? ['ok', 'Closed'] : ['soon', 'Open'], total: r => num(r.cost) || 0 },
  tyres: { one:'tyre entry', name:'Tyres', date:'date', hasV:1,
    fields:[VSEL, T('date','Date','date',{def:todayISO}), T('odo','Odometer (km)','num'), T('pos','Position','multi',{o:['FL','FR','RL','RR','Spare'], w:'wide'}), T('kind','New / rotate / repair','seg',{o:['New','Rotate','Repair'], w:'wide'}), T('brand','Brand & size'), T('tread','Tread (mm)','num'), T('cost','Cost (SCR)','num'), T('initials','Initials')],
    card: r => ({main: join([r.kind, r.pos]) || 'Tyres', meta: join([r.brand, fmtKm(r.odo), num(r.tread) != null && n0(r.tread) + ' mm tread']), amt: r.cost}),
    total: r => num(r.cost) || 0 },
  batteries: { one:'battery', name:'Battery', date:'dateFitted', hasV:1,
    fields:[VSEL, T('dateFitted','Date fitted','date',{def:todayISO}), T('odo','Odometer (km)','num'), T('brand','Brand & size'), T('warranty','Warranty until','date'), T('supplier','Supplier'), T('cost','Cost (SCR)','num'), T('initials','Initials')],
    card: r => ({main: r.brand || 'Battery fitted', meta: join([fmtKm(r.odo), r.supplier, r.warranty && 'Warranty until ' + fmtDate(r.warranty)]), amt: r.cost}),
    status: r => r.warranty ? (daysUntil(r.warranty) < 0 ? ['mute', 'Warranty ended'] : ['ok', 'Under warranty']) : null, total: r => num(r.cost) || 0 },
  fuel: { one:'fuel entry', name:'Fuel', date:'date', hasV:1,
    fields:[VSEL, T('date','Date','date',{def:todayISO}), T('did','Driver','driver'), T('odo','Odometer (km)','num'), T('litres','Litres','num',{req:1}), T('cost','Cost (SCR)','num'), T('full','Full tank','check'), T('station','Fuel station'), T('receipt','Receipt no.')],
    card: r => ({main: join([num(r.litres) != null && n0(r.litres) + ' litres', r.full && 'full tank']) || 'Fuel', meta: join([r.did && dname(r.did), fmtKm(r.odo), r.station, r.receipt && 'Receipt ' + r.receipt]), amt: r.cost}),
    total: r => num(r.cost) || 0,
    extra: (rows, vid) => { const l = rows.reduce((a, r) => a + (num(r.litres) || 0), 0); const c = vid ? consumption(rows) : ''; return (l ? ` · <b>${esc(n0(l))} L</b>` : '') + (c ? ` · <b>${esc(c)}</b>` : ''); } },
  trips: { one:'trip', name:'Trips', date:'date', hasV:1,
    fields:[DSEL, VSEL, T('date','Date','date',{def:todayISO}), T('tStart','Start time','time'), T('tEnd','End time','time'), T('kmStart','Start km','num'), T('kmEnd','End km','num'), T('from','From'), T('to','To / destination'), T('purpose','Purpose','text',{w:'wide', o:PURPOSES}), T('notes','Notes','textarea',{w:'wide'})],
    card: r => { const k = tripKm(r); return {main: route(r) || r.purpose || 'Trip', meta: join([r.did && dname(r.did), r.purpose, timeRange(r.tStart, r.tEnd)]), amtText: k != null ? fmtKm(k) : ''}; },
    check: d => { if (num(d.kmStart) != null && num(d.kmEnd) != null && d.kmEnd < d.kmStart) throw new Error('End km is lower than start km.'); },
    extra: rows => { const k = rows.reduce((a, r) => a + (tripKm(r) || 0), 0); return k ? ` · <b>${esc(fmtKm(k))}</b>` : ''; } },
  schedule: { one:'planned trip', name:'Schedule', date:'date', hasV:1,
    fields:[T('date','Date','date',{def:todayISO, req:1}), T('time','Time','time'), DSEL, T('vid','Vehicle reg. no.','vehicle',{hint:'Leave empty to use the driver’s assigned vehicle.'}), T('from','Pick-up / from'), T('to','Destination','text',{req:1}), T('purpose','Purpose','text',{o:PURPOSES}), T('notes','Notes for the driver','textarea',{w:'wide'}), T('status','Status','seg',{o:['Planned','Done','Cancelled'], w:'wide', def:'Planned'})],
    card: r => ({main: route(r) || 'Trip', meta: join([r.time, r.did && dname(r.did), r.purpose]), extra: r.notes || ''}),
    status: r => r.status === 'Done' ? ['ok', 'Done'] : r.status === 'Cancelled' ? ['mute', 'Cancelled'] : ['info', 'Planned'] },
  drivers: { one:'driver', name:'Drivers', date:'dateStart', hasV:0, fields:D_FIELDS,
    card: r => ({main: r.name || 'Driver', meta: join([r.phone, r.vid && vreg(r.vid)])}) },

function consumption(rows) {
  const pts = rows.filter(r => num(r.odo) != null && num(r.litres) != null).sort((a, b) => num(a.odo) - num(b.odo));
  if (pts.length < 2) return '';
  const km = num(pts[pts.length - 1].odo) - num(pts[0].odo);
  const l = pts.slice(1).reduce((a, r) => a + num(r.litres), 0);
  return km > 0 && l > 0 ? (l / km * 100).toFixed(1) + ' L/100 km' : '';
}
function driverAlerts(d) {

  if (n <= 30) return [{lvl:'soon', sort:n, text:`Driving licence expires in ${plural(n, 'day')}`, when:fmtDate(d.licExp)}];
  return [];
}
const monthKey = () => todayISO().slice(0, 7);

const longDate = iso => { const d = parseISO(iso); return d ? `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}` : ''; };
function latestOdo(vid) {
  let m = null; const t = x => { x = num(x); if (x != null && (m == null || x > m)) m = x; };
  const v = byId('vehicles', vid); if (v) t(v.odoBought);
  ['services', 'tyres', 'batteries', 'fuel'].forEach(c => S[c].forEach(r => r.vid === vid && t(r.odo)));

}
const REN = [['insExp','Insurance','expired','expires'],['licExp','Vehicle licence','expired','expires'],['testDue','Vehicle test','overdue','due'],['permitExp','Operating permit','expired','expires'],['nextSvcDate','Service','overdue','due']];
function alertsFor(v) {
  const out = [];
  if (v.dateOut) return out;
  for (const [k, label, past, fut] of REN) {
    const d = daysUntil(v[k]); if (d == null) continue;
    if (d < 0) out.push({lvl:'over', sort:d, text:`${label} ${past} ${plural(-d, 'day')} ago`, when:fmtDate(v[k])});
    else if (d === 0) out.push({lvl:'over', sort:0, text:`${label} ${fut} today`, when:fmtDate(v[k])});
    else if (d <= 30) out.push({lvl:'soon', sort:d, text:`${label} ${fut} in ${plural(d, 'day')}`, when:fmtDate(v[k])});
  }
  const nk = num(v.nextSvcKm), odo = latestOdo(v.id);
  if (nk != null && odo != null) {
    const rem = nk - odo;
    if (rem <= 0) out.push({lvl:'over', sort:-0.5, text:`Service overdue by ${fmtKm(-rem)}`, when:`Due at ${fmtKm(nk)}, last reading ${fmtKm(odo)}`});
    else if (rem <= 1000) out.push({lvl:'soon', sort:10, text:`Service due in ${fmtKm(rem)}`, when:`Due at ${fmtKm(nk)}, last reading ${fmtKm(odo)}`});

}
function dateStatus(iso, k) {

  if (d < 0) return ['over', past];

}

/* ---------------- saving (on this phone) ---------------- */
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const done = t => new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Saving was cancelled.')); });
function idbOpen() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) { rej(new Error('No storage')); return; }
    let r; try { r = indexedDB.open('cf-fleet-manager', 1); } catch (e) { rej(e); return; }
    r.onupgradeneeded = () => { const d = r.result; ['docs', 'photos', 'meta'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('Storage is busy'));
  });
}
async function idbPut(name, key, val) { const t = IDB.transaction(name, 'readwrite'); t.objectStore(name).put(val, key); await done(t); }
async function idbDel(name, key) { const t = IDB.transaction(name, 'readwrite'); t.objectStore(name).delete(key); await done(t); }
const idbGet = (name, key) => reqP(IDB.transaction(name).objectStore(name).get(key));
async function idbAll(name) { const st = IDB.transaction(name).objectStore(name); const [k, v] = await Promise.all([reqP(st.getAllKeys()), reqP(st.getAll())]); return k.map((x, i) => [x, v[i]]); }
function saveErr(e) {
  if (e && (e.name === 'QuotaExceededError' || /quota/i.test(e.message || ''))) return 'This phone has no room left for the app. Make a backup, then delete old photos or entries.';
  return "Couldn't save on this phone. Close the app, open it again and retry.";
}
let persistAsked = false;
function askPersist() { if (persistAsked) return; persistAsked = true; try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* not supported */ } }
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function memPut(col, id, data) {
  if (col === 'company') { S.company = Object.assign({}, data); scheduleRender(); return; }
  const rec = Object.assign({}, data, {id});
  const i = S[col].findIndex(r => r.id === id);
  if (i >= 0) S[col][i] = rec; else S[col].push(rec);
  S[col] = [...S[col]]; scheduleRender();
}
async function putDoc(col, id, data) {
  const val = clone(data); delete val.id;
  if (IDB) { try { await idbPut('docs', col + '/' + id, val); } catch (e) { throw new Error(saveErr(e)); } askPersist(); }
  memPut(col, id, val);
}
async function mergeDoc(col, id, data) {
  const cur = col === 'company' ? S.company : byId(col, id);
  await putDoc(col, id, Object.assign({}, cur || {}, clone(data)));
}
async function delDoc(col, id) {
  if (IDB) { try { await idbDel('docs', col + '/' + id); } catch (e) { throw new Error(saveErr(e)); } }
  S[col] = S[col].filter(r => r.id !== id); scheduleRender();
}
async function setMeta(k, v) { META[k] = v; if (IDB) { try { await idbPut('meta', k, v); } catch (e) { /* reminder only */ } } }
async function loadAll() {
  COLS.forEach(c => { S[c] = []; }); S.company = {};
  (await idbAll('docs')).forEach(([k, v]) => {
    const i = String(k).indexOf('/'); if (i < 0) return;
    const col = k.slice(0, i), id = k.slice(i + 1);
    if (col === 'company') S.company = Object.assign({}, v); else if (S[col]) S[col].push(Object.assign({}, v, {id}));
  });
  META = Object.fromEntries(await idbAll('meta'));
}
async function boot() {

  catch (e) { IDB = null; MODE = 'nostore'; }

/* ---------------- rendering ---------------- */
let rq = 0;
function scheduleRender() { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; render(); }); }
const nav = {stack: [{v:'home'}]};
const top = () => nav.stack[nav.stack.length - 1];
const VIEWS = {};

function bannerHTML() {
  if (MODE === 'connecting') return '<div class="banner">Opening Fleet Manager…</div>';
  if (MODE === 'nostore') return '<div class="banner warn"><b>Not saving.</b> This browser won’t let the app save records, so anything you add is lost when you close it. Don’t use private browsing, and open the app from your home screen.</div>';
  return '';
}
function render() {
  if (MODE !== 'connecting' && !licensed) { renderGate(); return; }
  $('nav.tabs').hidden = false;
  const st = top();
  const view = VIEWS[st.v] || VIEWS.home;
  const r = view(st);
  $('#hTitle').textContent = r.title;
  $('#hSub').textContent = r.sub || '';
  $('#hSub').hidden = !r.sub;
  $('#hBack').hidden = nav.stack.length < 2;
  $('#hCo').textContent = S.company.name || '';
  $('#main').innerHTML = bannerHTML() + r.body;
  const cur = ([...nav.stack].reverse().find(s => TABS.includes(TABMAP[s.v] || s.v)) || {v:'home'}).v;
  const curTab = TABMAP[cur] || cur;
  $$('nav.tabs button').forEach(b => { if (b.dataset.v === curTab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
}
function syncHash() {
  const v = top().v;
  if (TOPS.includes(v) && location.hash.slice(1) !== v) { try { location.hash = v; } catch (e) { /* ignore */ } }
}
function go(v, params = {}, reset = false) {
  const entry = Object.assign({v}, params);
  if (reset) nav.stack = v === 'home' ? [entry] : [{v:'home'}, entry];
  else nav.stack.push(entry);
  syncHash(); window.scrollTo(0, 0); render();
}
function back() { if (nav.stack.length > 1) { nav.stack.pop(); syncHash(); window.scrollTo(0, 0); render(); } }
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1) || 'home';
  if (!TOPS.includes(h) || top().v === h) return;
  if (nav.stack.length > 1 && nav.stack[nav.stack.length - 2].v === h) { nav.stack.pop(); render(); return; }
  nav.stack = h === 'home' ? [{v:'home'}] : [{v:'home'}, {v:h}]; render();
});

function fieldHTML(f, val, o = {}) {

  if (v === undefined || v === null) v = '';

  const rq = f.req ? ' <i class="rq" aria-hidden="true">*</i>' : '';
  const hint = f.hint ? `<small class="hint">${esc(f.hint)}</small>` : '';
  const ph = f.ph ? ` placeholder="${esc(f.ph)}"` : '';
  if (f.t === 'textarea') return `<div class="${cls}"><label for="${id}">${esc(f.l)}${rq}</label><textarea id="${id}" data-k="${f.k}" rows="3"${ph}>${esc(v)}</textarea>${hint}</div>`;
  if (f.t === 'select') return `<div class="${cls}"><label for="${id}">${esc(f.l)}${rq}</label><select id="${id}" data-k="${f.k}"><option value="">Choose</option>${f.o.map(x => `<option${x === v ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select>${hint}</div>`;
  if (f.t === 'driver') {
    const ds = driversSorted().filter(x => !x.dateLeft || x.id === v);
    let opts = ds.map(x => `<option value="${esc(x.id)}"${x.id === v ? ' selected' : ''}>${esc(x.name || 'Driver')}</option>`).join('');
    if (v && !byId('drivers', v)) opts += `<option value="${esc(v)}" selected>Removed driver</option>`;
    const h3 = ds.length ? hint : '<small class="hint">Add drivers on the Drivers page first.</small>';
    return `<div class="${cls}"><label for="${id}">${esc(f.l)}${rq}</label><select id="${id}" data-k="${f.k}"><option value="">${f.req ? 'Choose a driver' : 'None'}</option>${opts}</select>${h3}</div>`;
  }
  if (f.t === 'vehicle') {
    const vs = vehiclesSorted();
    if (!v && o.isNew && f.req) { const a = activeVehicles(); if (a.length === 1) v = a[0].id; }

  }

const formHTML = (fields, rec, o = {}) => `<div class="fg">${fields.map(f => fieldHTML(f, getPath(rec || {}, f.k), o)).join('')}</div>`;
function readForm(root) {
  const out = {};
  $$('[data-k]', root).forEach(el => {
    let v;
    if ('seg' in el.dataset || 'multi' in el.dataset) v = el.dataset.v || '';
    else if (el.type === 'checkbox') v = el.checked;
    else if (el.type === 'number') v = el.value === '' ? null : Number(el.value);
    else v = el.value.trim();
    setPath(out, el.dataset.k, v);
  });
  return out;
}
function validate(fields, data, root) {
  $$('.fld.bad', root).forEach(e => e.classList.remove('bad'));
  for (const f of fields) {
    if (!f.req) continue;
    const v = getPath(data, f.k);
    if (v === null || v === undefined || v === '') {
      const el = root.querySelector(`[data-k="${f.k}"]`);
      if (el) { el.closest('.fld').classList.add('bad'); el.focus(); }
      throw new Error(`${f.l} is needed.`);
    }
  }
}
function fmtVal(f, v) {
  if (v === undefined || v === null || v === '' || v === false && f.t !== 'check') return '<span class="na">—</span>';
  if (f.t === 'date') return esc(fmtDate(v));
  if (f.t === 'datetime') return esc(fmtDT(v));
  if (f.t === 'check') return v ? 'Yes' : 'No';
  if (f.t === 'vehicle') return esc(vreg(v));
  if (f.t === 'driver') return esc(dname(v));
  if (f.u === 'km') return esc(fmtKm(v));
  if (f.u === 'scr') return esc(money(v));
  if (f.t === 'num') return esc(n0(v));
  return esc(v);
}
const dlHTML = (fields, rec) => `<dl class="dl">${fields.map(f => `<div class="${f.w === 'wide' ? 'wide' : ''}"><dt>${esc(f.l)}</dt><dd>${fmtVal(f, getPath(rec, f.k))}</dd></div>`).join('')}</dl>`;

const sheet = {save:null, del:null, cleanup:null, armed:0};
function shMsg(t, ok) { const m = $('#shMsg'); m.textContent = t || ''; m.classList.toggle('okm', !!ok); }
function openSheet({title, html, save, del, saveLabel, after}) {
  sheet.pm = null;
  $('#shTitle').textContent = title;
  const body = $('#shBody'); body.innerHTML = html; body.scrollTop = 0; hydratePhotos(body);
  sheet.save = save || null; sheet.del = del || null; sheet.cleanup = null; disarm();
  $('#shSave').textContent = saveLabel || 'Save';
  $('#shSave').hidden = !save || !W();
  $('#shSave').disabled = false;
  $('#shDel').hidden = !del || !W();
  shMsg('');
  $('#sheet').classList.add('open'); $('#sheet').setAttribute('aria-hidden', 'false');
  document.body.classList.add('lock');

}
function closeSheet() {
  if (sheet.cleanup) sheet.cleanup();
  if (sheet.pm) { discardPhotos(sheet.pm); sheet.pm = null; }
  lbClose();
  $('#sheet').classList.remove('open'); $('#sheet').setAttribute('aria-hidden', 'true');
  document.body.classList.remove('lock');
  $('#shBody').innerHTML = ''; sheet.save = sheet.del = null;
}

  const btn = $('#shSave'); btn.disabled = true; shMsg('');
  try { const ok = await sheet.save($('#shBody')); if (ok !== false) { closeSheet(); toast('Saved'); } }
  catch (e) { shMsg(e.message || String(e)); }
  finally { btn.disabled = false; }
}
async function doDelete() {
  const b = $('#shDel');
  if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'Tap again to delete'; sheet.armed = setTimeout(disarm, 4000); return; }
  disarm();
  try { await sheet.del(); closeSheet(); toast('Deleted'); } catch (e) { shMsg(e.message || String(e)); }
}
let toastT = 0;
function toast(t, err) { const el = $('#toast'); el.textContent = t; el.classList.toggle('err', !!err); el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2600); }

function rowHTML(col, r, o = {}) {
  const d = LOGS[col]; const c = d.card(r); const st = d.status ? d.status(r) : null;
  const dt = r[d.date] ? fmtDate(r[d.date]) : '';
  return `<div class="row ${st ? st[0] : ''}" role="button" tabindex="0" data-act="edit-log" data-col="${col}" data-id="${esc(r.id)}">
    <div class="r-top">${dt ? `<span>${dt}</span>` : ''}${d.hasV && !o.fixed ? `<span class="reg">${esc(vreg(r.vid))}</span>` : ''}${pill(st)}${r.photos && r.photos.length ? pill(['mute', plural(r.photos.length, 'photo')]) : ''}</div>
    <div class="r-main">${esc(c.main)}</div>
    ${c.meta ? `<div class="r-meta">${esc(c.meta)}</div>` : ''}${c.extra ? `<div class="r-extra">${esc(c.extra)}</div>` : ''}${c.foot ? `<div class="r-foot">${esc(c.foot)}</div>` : ''}
    ${num(c.amt) != null ? `<div class="r-amt">${esc(money(c.amt))}</div>` : c.amtText ? `<div class="r-amt">${esc(c.amtText)}</div>` : ''}
  </div>`;
}
function logSection(col, o = {}) {
  const d = LOGS[col]; const vid = o.vid || '';
  const rows = S[col].filter(r => (!vid || r.vid === vid) && (!o.did || r.did === o.did))
    .sort((a, b) => String(b[d.date] || '').localeCompare(String(a[d.date] || '')) || (b.created || 0) - (a.created || 0));
  const total = d.total ? rows.reduce((s, r) => s + d.total(r), 0) : null;
  const open = d.status ? rows.filter(r => { const s = d.status(r); return s && (s[0] === 'soon' || s[0] === 'info'); }).length : 0;
  const summary = `<span><b>${rows.length}</b> ${rows.length === 1 ? 'entry' : 'entries'}${total ? ` · <b>${esc(money(total))}</b>` : ''}${open ? ` · <b>${open}</b> open` : ''}${d.extra ? d.extra(rows, vid) : ''}</span>`;
  const add = W() ? `<button class="btn pri sm" type="button" data-act="new-log" data-col="${col}" data-vid="${esc(vid)}" data-did="${esc(o.did || '')}">Add ${esc(d.one)}</button>` : '';
  const list = rows.length ? `<div class="list">${rows.map(r => rowHTML(col, r, {fixed: !!o.fixed})).join('')}</div>` : `<div class="empty">No ${esc(d.name ? d.name.toLowerCase() : 'entries')} logged${vid ? ' for this vehicle' : ''} yet.</div>`;
  return `<section class="lsec">${o.heading ? `<h2>${esc(d.name)}</h2>` : ''}<div class="sumbar">${summary}${add}</div>${list}</section>`;
}

function logView(cols, key) {
  return st => {

function yearsFor(vid) {
  const y = new Date().getFullYear(); const set = new Set([y, y - 1]);
  S.monthly.forEach(m => { if (m.vid === vid && num(m.year)) set.add(num(m.year)); });
  const v = byId('vehicles', vid); const p = v && splitISO(v.dateIn); if (p) for (let k = p[0]; k <= y; k++) set.add(k);
  return [...set].sort((a, b) => b - a);
}
function monthlySection(vid, year) {
  const doc = byId('monthly', vid + '_' + year); const m = (doc && doc.m) || {};
  const tot = {}; MF.forEach(([k]) => { tot[k] = 0; }); let gt = 0;
  const perKm = (c, km) => km > 0 && c > 0 ? (c / km).toFixed(2) : '';
  const rows = MONTHS.map((name, i) => {
    const r = m[i + 1] || {}; MF.forEach(([k]) => { tot[k] += num(r[k]) || 0; });
    const t = COSTF.reduce((s, k) => s + (num(r[k]) || 0), 0); gt += t;
    const has = MF.some(([k]) => num(r[k]) != null);
    return `<tr><td><b>${name}</b></td>${MF.map(([k]) => `<td>${esc(n0(r[k]))}</td>`).join('')}<td><b>${has ? esc(n0(t)) : ''}</b></td><td>${esc(perKm(t, num(r.km) || 0))}</td></tr>`;
  }).join('');
  const sel = `<div class="fbar"><label for="yr">Year</label><select id="yr" data-change="year">${yearsFor(vid).map(y => `<option${y === +year ? ' selected' : ''}>${y}</option>`).join('')}</select>${W() ? `<button class="btn pri sm" type="button" data-act="edit-monthly" data-id="${esc(vid)}" data-year="${year}">Fill in ${year}</button>` : ''}</div>`;
  return `${sel}<div class="tw"><table class="grid"><thead><tr><th>Month</th>${MF.map(([, l]) => `<th>${esc(l)}</th>`).join('')}<th>Total cost (SCR)</th><th>SCR per km</th></tr></thead><tbody>${rows}<tr class="tot"><td>Year total</td>${MF.map(([k]) => `<td>${esc(n0(tot[k]))}</td>`).join('')}<td>${esc(n0(gt))}</td><td>${esc(perKm(gt, tot.km))}</td></tr></tbody></table></div>`;
}

function checkGrid(vid) {
  const list = S.checks.filter(c => c.vid === vid).sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')) || (a.created || 0) - (b.created || 0)).slice(-8);
  if (!list.length) return '<div class="empty">No checks for this vehicle yet.</div>';
  const cell = v => v === 'ok' ? '<td class="c ok">✓</td>' : v === 'fix' ? '<td class="c fix">✗</td>' : '<td class="c"></td>';
  const head = `<tr><th>Check</th>${list.map(c => `<th style="text-align:center"><button class="thb" type="button" data-act="edit-check" data-id="${esc(c.id)}">${esc(fmtShort(c.date))}</button></th>`).join('')}</tr>`;
  const body = CHECK.map(([g, items]) => `<tr class="grp"><td colspan="${list.length + 1}">${esc(g)}</td></tr>` + items.map(([k, l]) => `<tr><td class="it">${esc(l)}</td>${list.map(c => cell(c.items && c.items[k])).join('')}</tr>`).join('')).join('');
  const sig = `<tr class="tot"><td>Checked by</td>${list.map(c => `<td style="text-align:center">${esc(c.did ? dname(c.did) : (c.initials || ''))}</td>`).join('')}</tr>`;
  return `<div class="tw"><table class="grid"><thead>${head}</thead><tbody>${body}${sig}</tbody></table></div><p class="muted" style="font-size:14px">Tap a date to open that check.</p>`;
}

function assetErr(e) {
  const c = e && e.code;
  if (c === 'too_large') return 'That photo is too big to upload.';
  if (c === 'unsupported_type') return "That file can't be used. Choose a JPG or PNG photo.";
  if (c === 'quota_or_state') return 'Photo storage for this app is full. Delete old photos to make room.';
  if (c === 'rate_limited') return 'Too many photos at once. Wait a moment, then try again.';

  return "The photo couldn't be uploaded. Check your connection and try again.";
}
const localStamp = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
function photoTime(f) { const lm = f && f.lastModified, now = Date.now(); return localStamp(lm && lm <= now + 60000 && lm > now - 1000 * DAY ? new Date(lm) : new Date()); }
async function decodeImage(file) {
  if (window.createImageBitmap) { try { return await createImageBitmap(file); } catch (e) { /* try an <img> instead */ } }
  const url = URL.createObjectURL(file);
  try { return await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; }); }
  catch (e) { return null; }
  finally { setTimeout(() => URL.revokeObjectURL(url), 2000); }
}
async function preparePhoto(file, stamp) {
  const img = await decodeImage(file);
  if (!img) { if (/^image\/(jpeg|png|webp|gif)$/.test(file.type)) return file; throw new Error("This photo can't be read. Choose a JPG or PNG photo."); }
  const w0 = img.width || img.naturalWidth, h0 = img.height || img.naturalHeight;
  const sc = Math.min(1, 1600 / Math.max(w0, h0));
  const w = Math.max(1, Math.round(w0 * sc)), h = Math.max(1, Math.round(h0 * sc));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, w, h);
  if (img.close) img.close();
  if (stamp) {
    let fs = Math.max(14, Math.round(Math.min(w, h) / 24));
    const font = () => { x.font = `700 ${fs}px Barlow, Arial, sans-serif`; return x.measureText(stamp).width; };
    let tw = font();
    if (tw > w * 0.94) { fs = Math.max(9, Math.floor(fs * w * 0.94 / tw)); tw = font(); }
    const pad = Math.round(fs * 0.55), bh = fs + pad * 2;
    x.fillStyle = 'rgba(43,48,54,.85)'; x.fillRect(w - tw - pad * 2, h - bh, tw + pad * 2, bh);
    x.fillStyle = '#FFD400'; x.textBaseline = 'middle'; x.fillText(stamp, w - tw - pad, h - bh / 2);
  }
  return await new Promise((res, rej) => c.toBlob(b => (b ? res(b) : rej(new Error("Couldn't prepare the photo."))), 'image/jpeg', 0.82));
}
async function uploadPhoto(file, stamp) {
  const blob = await preparePhoto(file, stamp);
  const id = 'ph' + newId();
  if (IDB) { try { await idbPut('photos', id, blob); } catch (e) { throw new Error(saveErr(e)); } askPersist(); }
  else MEMPH[id] = blob;
  URLS[id] = URL.createObjectURL(blob);
  return id;
}

const LKA = [90, 58, 31, 241, 209, 235, 167, 121, 158, 183, 22, 208, 229, 220, 195, 76, 93, 212, 236, 254, 223, 220, 194, 19, 68, 71, 21, 58, 206, 242, 246, 55], LKB = [35, 231, 149, 41, 116, 162, 196, 227, 230, 28, 219, 244, 215, 145, 219, 15, 249, 219, 54, 41, 243, 28, 255, 202, 141, 253, 138, 70, 147, 42, 200, 121];
const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
let licensed = false;
const normName = v => String(v || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const normCode = v => String(v || '').toUpperCase().replace(/[^0-9A-Z]/g, '').replace(/O/g, '0').replace(/[IL]/g, '1');
const fmtCode = c => (normCode(c).match(/.{1,4}/g) || []).join('-');
async function licenceCode(name) {
  const key = await crypto.subtle.importKey('raw', new Uint8Array(LKA.map((x, i) => x ^ LKB[i])), {name: 'HMAC', hash: 'SHA-256'}, false, ['sign']);
  const sig = new Uint8Array(await crypto.subtle.sign('HMAC', key, new TextEncoder().encode('CF-FLEET-MANAGER-1|' + normName(name))));

  return out.slice(0, 12);
}

const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });

async function makeBackup(withPhotos) {

async function restoreBackup(d) {

  const ds = t.objectStore('docs'), ps = t.objectStore('photos');
  ds.clear(); ps.clear();
  docs.forEach(x => ds.put(x.data, x.col + '/' + x.id));
  blobs.forEach(([id, b]) => ps.put(b, id));
  try { await done(t); } catch (e) { throw new Error(saveErr(e)); }

}

    }});
}
function monthlyTotals(body) {
  const tot = {}; let gt = 0; MF.forEach(([k]) => { tot[k] = 0; });
  $$('tr[data-m]', body).forEach(tr => {
    let t = 0, has = false;
    $$('input[data-mf]', tr).forEach(inp => { const x = num(inp.value); if (x != null) { has = true; tot[inp.dataset.mf] += x; if (COSTF.includes(inp.dataset.mf)) t += x; } });
    gt += t; tr.querySelector('.mt').textContent = has ? n0(t) : '';
  });
  MF.forEach(([k]) => { body.querySelector(`[data-tf="${k}"]`).textContent = n0(tot[k]); });
  body.querySelector('[data-tf="all"]').textContent = n0(gt);
}
function fromLogs(vid, year) {
  const res = Array.from({length: 12}, () => ({km: 0, trips: 0, fuelL: 0, fuel: 0, service: 0, repairs: 0, tyres: 0}));
  const Y = +year;
  const at = iso => { const p = splitISO(iso); return p && p[0] === Y ? p[1] - 1 : -1; };
  S.trips.forEach(r => { if (r.vid !== vid) return; const i = at(r.date); if (i < 0) return; res[i].trips++; res[i].km += tripKm(r) || 0; });
  S.fuel.forEach(r => { if (r.vid !== vid) return; const i = at(r.date); if (i >= 0) { res[i].fuelL += num(r.litres) || 0; res[i].fuel += num(r.cost) || 0; } });
  S.services.forEach(r => { if (r.vid !== vid) return; const i = at(r.date); if (i >= 0) res[i].service += num(r.cost) || 0; });
  S.repairs.forEach(r => { if (r.vid !== vid) return; const i = at(r.dateFixed || r.dateReported); if (i >= 0) res[i].repairs += num(r.cost) || 0; });
  S.tyres.forEach(r => { if (r.vid !== vid) return; const i = at(r.date); if (i >= 0) res[i].tyres += num(r.cost) || 0; });
  S.batteries.forEach(r => { if (r.vid !== vid) return; const i = at(r.dateFitted); if (i >= 0) res[i].tyres += num(r.cost) || 0; });
  return res;
}
function editCheck(id, vid) {
  const v0 = vid || ((activeVehicles()[0] || {}).id) || ''; const a0 = assignedTo(v0);
  const rec = id ? clone(byId('checks', id)) : {vid: v0, did: a0.length === 1 ? a0[0].id : '', date: todayISO(), items: {}};
  if (id && !rec.id) return;
  const groups = CHECK.map(([g, items]) => `<div class="ckg"><h3>${esc(g)}</h3>${items.map(([k, l]) => { const v = (rec.items || {})[k] || ''; return `<div class="ck"><span id="ck_${k}">${esc(l)}</span><div class="seg ckseg" role="group" aria-labelledby="ck_${k}" data-k="items.${k}" data-seg data-v="${v}"><button type="button" data-sv="ok" aria-pressed="${v === 'ok'}">✓ OK</button><button type="button" data-sv="fix" aria-pressed="${v === 'fix'}">✗ Fix first</button></div></div>`; }).join('')}</div>`).join('');
  const html = formHTML([VSEL, T('date', 'Date', 'date')], rec) + `<div class="qa"><button class="btn sm" type="button" data-act="ck-all">Mark all OK</button></div>` + groups +
    formHTML([T('did', 'Checked by (driver)', 'driver', {req: 1})], rec) +
    (id ? '' : '<label class="chk" for="ckFix"><input type="checkbox" id="ckFix" checked><span>Add ✗ items to the Repairs &amp; defects log</span></label>') +
    tipHTML('Anything marked ✗ goes in the Repairs & defects log before the vehicle is used.');
  openSheet({title: id ? 'Pre-trip check' : 'New pre-trip check', html,
    save: async body => {
      const d = readForm(body); validate([VSEL, T('did', 'Checked by (driver)', 'driver', {req: 1})], d, body);
      const items = {}; Object.entries(d.items || {}).forEach(([k, v]) => { if (v) items[k] = v; });
      const addFix = !id && $('#ckFix', body) && $('#ckFix', body).checked;
      const data = {vid: d.vid, date: d.date || todayISO(), did: d.did, items, created: rec.created || Date.now()};
      await putDoc('checks', id || newId('checks'), data);
      if (addFix) {
        const fixes = CHECK_ITEMS.filter(([k]) => items[k] === 'fix');
        for (const [, l] of fixes) await putDoc('repairs', newId('repairs'), {vid: d.vid, dateReported: data.date, reportedBy: 'Pre-trip check (' + dname(d.did) + ')', defect: l, action: '', dateFixed: '', daysOff: null, cost: null, initials: '', did: d.did, created: Date.now()});
        if (fixes.length) setTimeout(() => toast(plural(fixes.length, 'item') + ' added to the Repairs & defects log'), 300);
      }
    },
    del: id ? async () => { await delDoc('checks', id); } : null});
}

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  // segmented buttons
  const sb = e.target.closest('.seg button[data-sv]');
  if (sb) {
    const g = sb.closest('.seg'); const v = sb.dataset.sv;
    const nv = (g.dataset.v === v && !('req' in g.dataset)) ? '' : v;
    g.dataset.v = nv; $$('button[data-sv]', g).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sv === nv)));
    if (sheet.ho && g.id === 'dPhase') sheet.ho.setPhase(nv);
    if (sheet.ho && g.id === 'dCode') sheet.ho.setCode(nv);
    return;
  }
  const mb = e.target.closest('.seg.multi button[data-mv]');
  if (mb) {
    mb.setAttribute('aria-pressed', String(mb.getAttribute('aria-pressed') !== 'true'));
    const g = mb.closest('.seg'); g.dataset.v = $$('button[data-mv]', g).filter(b => b.getAttribute('aria-pressed') === 'true').map(b => b.dataset.mv).join(' ');
    return;
  }
  if (sheet.ho && e.target.closest('#shBody .dz')) { sheet.ho.tap(e, $('#shBody')); return; }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id || '';
  const st = top();
  switch (a) {
    case 'back': back(); break;
    case 'tab': go(t.dataset.v, {}, true); break;
    case 'go': go(t.dataset.v, t.dataset.vid ? {vid: t.dataset.vid} : {}); break;
    case 'open-car': go('car', {id}); break;
    case 'car-tab': st.tab = t.dataset.tab; render(); break;
    case 'toggle-sold': st.sold = !st.sold; render(); break;
    case 'pick-check': st.vid = id; render(); break;
    case 'edit-company': editCompany(); break;
    case 'new-car': editVehicle(null, 'reg'); break;
    case 'edit-veh': editVehicle(id, t.dataset.g); break;
    case 'new-log': {
      const pre = {}; if (t.dataset.vid) pre.vid = t.dataset.vid; if (t.dataset.did) pre.did = t.dataset.did;
      if (pre.did && !pre.vid && !['schedule', 'drivers'].includes(t.dataset.col)) { const dd = byId('drivers', pre.did); if (dd && dd.vid) pre.vid = dd.vid; }
      editLog(t.dataset.col, null, pre); break;
    }
    case 'edit-log': editLog(t.dataset.col, id); break;
    case 'edit-monthly': editMonthly(id, t.dataset.year); break;
    case 'mfill': {
      const body = $('#shBody'); const res = fromLogs(id, t.dataset.year); let n = 0;
      $$('tr[data-m]', body).forEach(tr => { const r = res[+tr.dataset.m - 1]; Object.entries(r).forEach(([k, v]) => { const inp = tr.querySelector(`input[data-mf="${k}"]`); if (inp && v > 0) { inp.value = Math.round(v * 100) / 100; n++; } }); });
      monthlyTotals(body); $('#mNote', body).textContent = n ? `Filled ${plural(n, 'box', 'boxes')} from your logs. Check them, add anything else under “Other”, then Save.` : 'Nothing logged for this car in this year yet.';
      break;
    }
    case 'new-check': editCheck(null, t.dataset.vid || (st.v === 'checks' && st.vid) || ''); break;
    case 'edit-check': editCheck(id); break;
    case 'ck-all': $$('#shBody .ckseg').forEach(g => { g.dataset.v = 'ok'; $$('button', g).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sv === 'ok'))); }); break;
    case 'open-driver': go('driver', {id}); break;
    case 'toggle-left': st.left = !st.left; render(); break;
    case 'swap': nav.stack[nav.stack.length - 1] = {v: t.dataset.v}; syncHash(); window.scrollTo(0, 0); render(); break;
    case 'sched-f': st.f = t.dataset.f; render(); break;
    case 'log-trip': {
      const sc = byId('schedule', id); if (!sc) break;
      const dd = byId('drivers', sc.did); const vid = sc.vid || (dd && dd.vid) || '';
      editLog('trips', null, {sid: sc.id, did: sc.did || '', vid, date: sc.date, tStart: sc.time || '', from: sc.from || '', to: sc.to || '', purpose: sc.purpose || '', kmStart: vid ? latestOdo(vid) : null});
      break;
    }
    case 'copy-card': {
      const txt = cardText(id);
      const fallback = () => { const ta = $('#cardTxt'); if (ta) { ta.classList.remove('sr'); ta.removeAttribute('aria-hidden'); ta.style.cssText = 'width:100%;height:170px;margin-top:8px'; ta.select(); } toast('Select the text and copy it'); };
      try { navigator.clipboard.writeText(txt).then(() => toast('Card copied. Paste it into WhatsApp.'), fallback); } catch (x) { fallback(); }
      break;
    }
    case 'ph-view': lbOpen(t.dataset.pid); break;
    case 'ph-rm': {
      const pm = sheet.pm; if (!pm) break;
      const i = pm.list.findIndex(x => x.id === t.dataset.pid);
      if (i >= 0) { pm.list.splice(i, 1); pm.removed.add(t.dataset.pid); refreshPhotos(pm); toast('Photo removed. Cancel to keep it.'); }
      break;
    }
    case 'lb-close': lbClose(); break;
    case 'lb-prev': if (lb.i > 0) { lb.i--; lbShow(); } break;
    case 'lb-next': if (lb.i < lb.items.length - 1) { lb.i++; lbShow(); } break;
    case 'bk-make': {
      const ph = $('#bkPh') ? $('#bkPh').checked : true;
      t.disabled = true; t.textContent = 'Making backup…';
      makeBackup(ph).then(render).catch(() => { toast('Couldn’t make the backup file.', true); render(); });
      break;
    }
    case 'bk-share': shareBackup(); break;
    case 'bk-cancel': RS = null; render(); break;
    case 'bk-restore': {
      if (!RS) break;
      if (!t.classList.contains('armed')) { t.classList.add('armed'); t.textContent = 'Tap again to replace everything'; setTimeout(() => { t.classList.remove('armed'); t.textContent = 'Replace everything with this backup'; }, 4000); break; }
      t.disabled = true; t.textContent = 'Restoring…';
      restoreBackup(RS.data).then(() => { toast('Backup restored'); go('home', {}, true); }).catch(e => { toast(e.message, true); render(); });
      break;
    }
    case 'install': if (installEvt) { const ev = installEvt; installEvt = null; ev.prompt(); Promise.resolve(ev.userChoice).finally(render); } break;
    case 'install-hide': setMeta('installHide', true).then(render); break;
    case 'activate': activate(); break;
    case 'close-sheet': closeSheet(); break;
    case 'sheet-save': doSave(); break;
    case 'sheet-del': doDelete(); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.change === 'filter') { top().vid = t.value; render(); }
  else if (t.dataset.change === 'year') { top().year = +t.value; render(); }
  else if (t.dataset.change === 'dfilter') { top().did = t.value; render(); }
  else if (t.dataset.change === 'month') { top().month = t.value; render(); }
  else if (t.dataset.k === 'did' && t.closest('#shBody')) {
    const dd = byId('drivers', t.value), vsel = $('#shBody select[data-k="vid"]');
    if (dd && dd.vid && vsel && !vsel.value && byId('vehicles', dd.vid)) vsel.value = dd.vid;
  }
  else if (t.dataset.restore) {
    const f = t.files && t.files[0]; t.value = '';
    if (f) readBackup(f).then(d => { RS = {data: d, exported: d.exported, company: d.company, cars: d.docs.filter(x => x && x.col === 'vehicles').length, entries: d.docs.filter(x => x && x.col !== 'vehicles' && x.col !== 'company').length, photos: Object.keys(d.photos || {}).length}; render(); }).catch(e => toast(e.message, true));
  }
  else if (t.dataset.up && sheet.pm) { const files = [...(t.files || [])]; t.value = ''; if (files.length) addPhotos(sheet.pm, files, t.dataset.up); }
  else if (sheet.ho && t.dataset.k === 'vid' && t.closest('#shBody')) sheet.ho.vehicleChanged(t, $('#shBody'));
});
document.addEventListener('error', e => { const el = e.target; if (el && el.tagName === 'IMG' && el.closest('.ph')) el.closest('.ph').classList.add('broken'); }, true);
document.addEventListener('input', e => { if (e.target.dataset.mf) monthlyTotals($('#shBody')); });
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && e.target.closest('#gate') && e.target.tagName === 'INPUT') { e.preventDefault(); activate(); }
  if (e.key === 'Escape') { if (!$('#lb').hidden) lbClose(); else if ($('#sheet').classList.contains('open')) closeSheet(); }
});

/* ---------------- start ---------------- */
const h0 = location.hash.slice(1);
if (TOPS.includes(h0) && h0 !== 'home') nav.stack = [{v:'home'}, {v:h0}];
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; scheduleRender(); });
window.addEventListener('appinstalled', () => { installEvt = null; scheduleRender(); });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
boot();
})();
</script>
